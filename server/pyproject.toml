[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photos_viewer*"]

[project]
name = "photos-viewer"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the version installed and exercised on the Linux dev box.
    # osxphotos README (as of this pin) claims read support for Photos
    # databases from macOS 10.15 Catalina (Photos 5) through macOS 26/27
    # (Photos 12); see photos_viewer/libraries.py for the version table
    # this server actually accepts.
    "osxphotos==0.77.2",
    "fastapi",
    # FileResponse answers Range requests (the PMTiles route) from 0.39.
    "starlette>=0.39",
    "uvicorn",
    "argon2-cffi",
    # P3.1 passkeys. Pure Python on top of cryptography and cbor2; attestation
    # is "none", so it never fetches metadata and makes no network calls.
    "webauthn>=3,<4",
    # Media backend (P1.7): the cross-platform fallback decoder, used on
    # Linux always and on macOS whenever sips/qlmanage are unavailable.
    "Pillow",
    "pillow-heif",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-socket",
    "httpx",
    "pyyaml",
    "ruff",
]
# RAW decoding (P1.7) is optional: a library with no RAW originals never
# needs it, and it wraps LibRaw, a heavier native dependency.
raw = [
    "rawpy",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is `param: X = Depends(...)` by design: the
# call builds a sentinel FastAPI resolves at request time, it never runs at
# import time. This is FastAPI's own documented B008 exception.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.pytest.ini_options]
# conftest.py also puts this directory on sys.path, so `import
# photos_viewer` resolves even without the `pip install -e` below.
testpaths = ["tests"]
# The server makes zero outbound requests (see CLAUDE.md "Offline at
# runtime"). Enforce that for the whole suite, not just test_no_network.py's
# socket.socket.connect guard: only loopback is reachable, everything else
# raises pytest_socket.SocketBlockedError.
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1"
