name: CI

# Phase 0 gate (see CLAUDE.md, docs/TASKS.md P0.4): the server tests and the
# probe CLI must both pass against the synthetic fixture on Linux and on
# macOS. Phase 1 (P1.1) adds the web job: Linux only, npm test plus a check
# that the production bundle has no external URL besides the OSM tile host
# and its copyright link (see CLAUDE.md "Offline at runtime").

# Billing: every job runs on a GitHub-hosted runner. Standard hosted runners,
# including macOS, are free and unlimited for public repositories. The repo
# must stay public for this: on a private repo the macOS job bills at 10x.
# server-macos runs on every push and every pull request, same as server.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      # P0.6: never let osxphotos reach out for a version check.
      OSXPHOTOS_NO_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      # uv provides Python 3.12 in a throwaway venv (no preinstalled Python needed on hosted runners).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install server dependencies
        run: uv pip install -e "./server[dev]"

      - name: Lint
        working-directory: server
        run: ruff check .

      - name: Format check
        working-directory: server
        run: ruff format --check .

      # P1.21: server/pyproject.toml addopts puts the whole suite under
      # pytest-socket (loopback only); test_no_network.py proves it is on.
      - name: Run server tests
        working-directory: server
        run: python -m pytest -q

      - name: Probe the synthetic fixture
        working-directory: server
        run: |
          python <<'PY'
          import pathlib
          import sys
          import tempfile

          from tests.fixtures import build_fixture_library
          from photos_viewer.probe import main

          with tempfile.TemporaryDirectory() as tmp:
              package_path = build_fixture_library(pathlib.Path(tmp))
              exit_code = main([str(package_path)])

          sys.exit(exit_code)
          PY

  server-macos:
    runs-on: macos-latest
    env:
      # P0.6: never let osxphotos reach out for a version check.
      OSXPHOTOS_NO_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e "./server[dev]"

      - name: Lint
        working-directory: server
        run: ruff check .

      - name: Format check
        working-directory: server
        run: ruff format --check .

      # P1.21: server/pyproject.toml addopts puts the whole suite under
      # pytest-socket (loopback only); test_no_network.py proves it is on.
      - name: Run server tests
        working-directory: server
        run: python -m pytest -q

      - name: Probe the synthetic fixture
        working-directory: server
        run: |
          python <<'PY'
          import pathlib
          import sys
          import tempfile

          from tests.fixtures import build_fixture_library
          from photos_viewer.probe import main

          with tempfile.TemporaryDirectory() as tmp:
              package_path = build_fixture_library(pathlib.Path(tmp))
              exit_code = main([str(package_path)])

          sys.exit(exit_code)
          PY

  packaging:
    # P1.19: the compose file must stay valid. Nothing is built or run, so no
    # image is pulled and no library is involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Validate the launchd plist
        run: python3 -c "import plistlib,sys; plistlib.load(open('deploy/com.photosviewer.plist','rb'))"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Check colours live in tokens.css only
        working-directory: web
        # #218: no hex/rgb() literal or prefers-color-scheme block in any other
        # stylesheet; the rules are unit-tested by web/src/cssColours.test.ts.
        run: npm run check-colours

      - name: Check durations live in tokens.css only
        working-directory: web
        # #206: no literal ms/s time in a transition or animation outside
        # tokens.css; unit-tested by web/src/cssMotion.test.ts.
        run: npm run check-motion

      - name: Build the production bundle
        working-directory: web
        run: npm run build

      - name: Check the build has no unexpected external URL
        working-directory: web
        # P1.21: only the OSM tile template, its copyright link, localhost
        # and a few exact library strings may appear (scripts/external_urls.mjs).
        # The rules are unit-tested by web/src/externalUrls.test.ts in
        # `npm test` above.
        run: npm run check-urls
