name: CI

# Phase 0 gate (see CLAUDE.md, docs/TASKS.md P0.4): the server tests and the
# probe CLI must both pass against the synthetic fixture on Linux and on
# macOS. There's no root pyproject.toml or web/ yet (those land in Phase 1),
# so this workflow only covers server/.

on:
  push:
  pull_request:

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # P0.6: never let osxphotos reach out for a version check.
      OSXPHOTOS_NO_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: pip install osxphotos==0.77.2 pytest pytest-socket

      - name: Run server tests
        working-directory: server
        run: python -m pytest -q

      - name: Probe the synthetic fixture
        working-directory: server
        run: |
          python <<'PY'
          import pathlib
          import sys
          import tempfile

          sys.path.insert(0, ".")  # server/ isn't installed; see conftest.py

          from tests.fixtures import build_fixture_library
          from photos_viewer.probe import main

          with tempfile.TemporaryDirectory() as tmp:
              package_path = build_fixture_library(pathlib.Path(tmp))
              exit_code = main([str(package_path)])

          sys.exit(exit_code)
          PY
