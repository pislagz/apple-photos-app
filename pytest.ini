[pytest]
# Mirrors server/pyproject.toml's [tool.pytest.ini_options]. pytest finds its
# config by walking up from the invocation directory, so server/pyproject.toml
# alone doesn't apply when `pytest` runs from the repo root -- this file is
# what makes the socket ban (see CLAUDE.md "Offline at runtime") bind in that
# case too. There is no root pyproject.toml yet (Phase 1 adds one); don't put
# [tool.pytest.ini_options] in it before then, or pytest will use that instead
# of server/pyproject.toml for in-server-dir runs and the two configs could
# drift.
testpaths = server/tests
addopts = --disable-socket --allow-hosts=127.0.0.1,::1
