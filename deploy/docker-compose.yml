# Run from the repo root or from deploy/:
#   PHOTOS_LIBRARY_DIR=/mnt/photos docker compose -f deploy/docker-compose.yml up -d --build
#
# Egress: `viewer` sits ONLY on the `viewer` network, which is `internal: true`.
# Docker gives it no gateway to the internet and masquerades nothing, so the app
# cannot reach a tile host, a package index, or an update server, and cannot
# resolve public DNS. Docker does not publish ports from an internal-only
# container, and Tailscale Serve only proxies to localhost, so the `forward`
# sidecar (plain socat TCP passthrough, nothing else) joins the internal network
# and an ordinary one and publishes 0.0.0.0:8000 -> viewer:8000 (the LAN; see
# the `ports:` comment below to keep it on 127.0.0.1). For Tailscale on the host:
#   tailscale serve --bg 8000
# Tailscale Serve's X-Forwarded-* headers pass through unchanged. The app sees
# the forwarder (172.28.0.3) as its peer, hence the two trusted-proxy variables.
# Lockout caveat: the forwarder is a plain TCP relay, so every LAN client reaches
# the app from 172.28.0.3 and shares one coarse per-peer login-failure ceiling;
# the per-username lockout still applies. Running the app without Docker
# (README, "Use it on your home network") gives per-device lockout.
# The README's "No outbound egress" section adds the host firewall rule as a
# second layer.
#
# Read-only fixture check (what CI's pytest does without Docker): mount a
# synthetic library `:ro` and run the probe inside the same image:
#   docker compose -f deploy/docker-compose.yml run --rm \
#     -v "$PWD/fixture.photoslibrary:/libraries/fixture.photoslibrary:ro" \
#     viewer python -m photos_viewer.probe /libraries/fixture.photoslibrary
# The probe copies Photos.sqlite into /tmp (tmpfs) and never writes the package.

name: photos-viewer

services:
  viewer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: photos-viewer:local
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      # Temp copies of Photos.sqlite and transcode scratch. uid/gid match `user`.
      - /tmp:size=2g,mode=1777,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      viewer:
        ipv4_address: 172.28.0.2
    volumes:
      # One line per library, always `:ro`. Register the in-container path
      # (e.g. /libraries/family.photoslibrary) in the admin panel.
      - ${PHOTOS_LIBRARY_DIR:-./libraries}:/libraries:ro
      # Optional PMTiles archive for Map tiles = Local file. Put map.pmtiles
      # in this directory; register /tiles/map.pmtiles in the admin settings.
      - ${PHOTOS_TILES_DIR:-./tiles}:/tiles:ro
      # app.db, thumbnails, logs: the only writable mount.
      - viewer-data:/data
    environment:
      PHOTOS_VIEWER_DATA_DIR: /data
      OSXPHOTOS_NO_VERSION_CHECK: "1"
      # Home network needs nothing here: a same-host Origin is accepted and the
      # session cookie is Secure only when the request arrived over https. Set
      # this only if a proxy rewrites Host (e.g. Tailscale Serve setups that
      # don't forward it): PHOTOS_VIEWER_PUBLIC_ORIGINS=https://myhost.tailxyz.ts.net
      PHOTOS_VIEWER_PUBLIC_ORIGINS: ${PHOTOS_VIEWER_PUBLIC_ORIGINS:-}
      # Requests arrive from the forwarder's pinned address, not loopback.
      UVICORN_FORWARDED_ALLOW_IPS: 172.28.0.3
      PHOTOS_VIEWER_TRUSTED_PROXIES: 172.28.0.3

  forward:
    # Inbound only: host 127.0.0.1:8000 -> viewer:8000. Pinned tag; the image's
    # entrypoint is socat. It holds no data and no secrets.
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["TCP-LISTEN:8000,fork,reuseaddr", "TCP:172.28.0.2:8000"]
    depends_on: [viewer]
    ports:
      # Home network (default): reachable from other devices on the LAN at
      # http://<this-machine>:8000. For a Tailscale-only setup, restrict it to
      # this machine by using "127.0.0.1:8000:8000" instead (Tailscale Serve
      # connects from localhost).
      - "0.0.0.0:8000:8000"
    networks:
      viewer:
        ipv4_address: 172.28.0.3
      edge: {}

volumes:
  viewer-data:

networks:
  viewer:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  # Ordinary bridge, used only to publish the forwarder on host loopback.
  edge: {}
